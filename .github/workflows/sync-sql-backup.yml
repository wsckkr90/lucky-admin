name: Sync SQL backup

on:
  push:
    branches:
      - seo-admin-ui-final2

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[skip sql sync]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add SEO Manager tables to SQL backup
        shell: python
        run: |
          from pathlib import Path

          p = Path('lucky_satta.sql')
          text = p.read_text(encoding='utf-8')

          if 'CREATE TABLE `seo_sites`' in text or '2026_09_06_120000_create_seo_sites_and_pages_tables' in text:
              print('SEO backup changes already present; nothing to do.')
          else:
              migration_marker = "(29, '2026_09_01_064107_create_seo_contents_table', 10);"
              migration_replacement = migration_marker + "\n(30, '2026_09_06_120000_create_seo_sites_and_pages_tables', 11);"
              if migration_marker not in text:
                  raise SystemExit('Could not locate migrations seed row.')
              text = text.replace(migration_marker, migration_replacement, 1)

              auto_marker = "ALTER TABLE `migrations`\n  MODIFY `id` int(10) UNSIGNED NOT NULL AUTO_INCREMENT, AUTO_INCREMENT=30;"
              auto_replacement = "ALTER TABLE `migrations`\n  MODIFY `id` int(10) UNSIGNED NOT NULL AUTO_INCREMENT, AUTO_INCREMENT=31;"
              if auto_marker not in text:
                  raise SystemExit('Could not locate migrations AUTO_INCREMENT line.')
              text = text.replace(auto_marker, auto_replacement, 1)

              sql = r'''

--
-- Table structure for table `seo_sites`
--

CREATE TABLE `seo_sites` (
  `id` bigint(20) UNSIGNED NOT NULL,
  `name` varchar(255) NOT NULL,
  `domain` varchar(255) NOT NULL,
  `scheme` varchar(10) NOT NULL DEFAULT 'https',
  `logo_url` varchar(255) DEFAULT NULL,
  `organization_name` varchar(255) DEFAULT NULL,
  `same_as` longtext CHARACTER SET utf8mb4 COLLATE utf8mb4_bin DEFAULT NULL CHECK (json_valid(`same_as`)),
  `active` tinyint(1) NOT NULL DEFAULT 1,
  `created_at` timestamp NULL DEFAULT NULL,
  `updated_at` timestamp NULL DEFAULT NULL
) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

--
-- Table structure for table `seo_pages`
--

CREATE TABLE `seo_pages` (
  `id` bigint(20) UNSIGNED NOT NULL,
  `seo_site_id` bigint(20) UNSIGNED NOT NULL,
  `page_key` varchar(255) NOT NULL,
  `label` varchar(255) NOT NULL,
  `path` varchar(255) NOT NULL DEFAULT '/',
  `meta_title` varchar(255) DEFAULT NULL,
  `meta_description` text DEFAULT NULL,
  `focus_keyword` varchar(255) DEFAULT NULL,
  `secondary_keywords` text DEFAULT NULL,
  `canonical_url` text DEFAULT NULL,
  `robots` varchar(255) NOT NULL DEFAULT 'index,follow',
  `author` varchar(255) DEFAULT NULL,
  `published_at` datetime DEFAULT NULL,
  `og_title` varchar(255) DEFAULT NULL,
  `og_description` text DEFAULT NULL,
  `og_image` varchar(255) DEFAULT NULL,
  `twitter_title` varchar(255) DEFAULT NULL,
  `twitter_description` text DEFAULT NULL,
  `twitter_image` varchar(255) DEFAULT NULL,
  `schema_type` varchar(255) DEFAULT NULL,
  `schema_json` longtext CHARACTER SET utf8mb4 COLLATE utf8mb4_bin DEFAULT NULL CHECK (json_valid(`schema_json`)),
  `extra_head` longtext DEFAULT NULL,
  `created_at` timestamp NULL DEFAULT NULL,
  `updated_at` timestamp NULL DEFAULT NULL
) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

--
-- Indexes for table `seo_sites`
--

ALTER TABLE `seo_sites`
  ADD PRIMARY KEY (`id`),
  ADD UNIQUE KEY `seo_sites_domain_unique` (`domain`);

--
-- Indexes for table `seo_pages`
--

ALTER TABLE `seo_pages`
  ADD PRIMARY KEY (`id`),
  ADD UNIQUE KEY `seo_pages_seo_site_id_page_key_unique` (`seo_site_id`,`page_key`),
  ADD KEY `seo_pages_seo_site_id_path_index` (`seo_site_id`,`path`);

--
-- AUTO_INCREMENT for table `seo_sites`
--

ALTER TABLE `seo_sites`
  MODIFY `id` bigint(20) UNSIGNED NOT NULL AUTO_INCREMENT;

--
-- AUTO_INCREMENT for table `seo_pages`
--

ALTER TABLE `seo_pages`
  MODIFY `id` bigint(20) UNSIGNED NOT NULL AUTO_INCREMENT;

--
-- Constraints for table `seo_pages`
--

ALTER TABLE `seo_pages`
  ADD CONSTRAINT `seo_pages_seo_site_id_foreign` FOREIGN KEY (`seo_site_id`) REFERENCES `seo_sites` (`id`) ON DELETE CASCADE;
'''
              commit_marker = '\nCOMMIT;'
              if commit_marker not in text:
                  raise SystemExit('Could not locate final COMMIT marker.')
              text = text.replace(commit_marker, sql + commit_marker, 1)
              p.write_text(text, encoding='utf-8', newline='')

      - name: Validate SQL backup structure
        shell: bash
        run: |
          grep -q "CREATE TABLE \`seo_sites\`" lucky_satta.sql
          grep -q "CREATE TABLE \`seo_pages\`" lucky_satta.sql
          grep -q "2026_09_06_120000_create_seo_sites_and_pages_tables" lucky_satta.sql
          grep -q "seo_pages_seo_site_id_foreign" lucky_satta.sql
          echo "SEO SQL backup validation passed."

      - name: Commit updated SQL backup and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/sync-sql-backup.yml
          git add lucky_satta.sql .github/workflows/sync-sql-backup.yml
          git commit -m "fix: include SEO Manager tables in SQL backup [skip sql sync]"
          git push origin HEAD:seo-admin-ui-final2
